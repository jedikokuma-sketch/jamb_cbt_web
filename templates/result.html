<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="center-page">
    <main class="result-card">
        <div class="logo">✓</div>
        <h1>Examination Completed</h1>

        <div class="score">{{ score }} / {{ total }}</div>
        <div class="percentage">{{ "%.1f"|format(percentage) }}%</div>

        <div class="result-row">
            <span>Unanswered</span>
            <strong>{{ unanswered }}</strong>
        </div>

        <div class="performance">
            Performance: <strong>{{ grade }}</strong>
        </div>

        <a class="primary-btn link-btn" href="{{ url_for('index') }}">Take Another Exam</a>
    </main>
</body>
</html>
